<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Layanan - Sistem Reservasi Layanan</title>
  <link rel="stylesheet" href="/css/style.v2.css">
</head>
<body>
  <header class="navbar" id="navbar"></header>

  <main class="container">
    <div class="page-title">
      <h1>Daftar Layanan</h1>
      <p>Temukan layanan terbaik untuk kebutuhan Anda</p>
    </div>

    <!-- Filter -->
    <div style="display:flex;gap:0.75rem;margin-bottom:1.5rem;flex-wrap:wrap;align-items:center">
      <input type="text" id="search-input" class="form-control" placeholder="ðŸ” Cari layanan..." style="max-width:280px" data-testid="search-input">
      <select id="category-filter" class="form-control" style="max-width:180px" data-testid="category-filter">
        <option value="">Semua Kategori</option>
        <option value="Otomotif">Otomotif</option>
        <option value="Elektronik">Elektronik</option>
        <option value="Kecantikan">Kecantikan</option>
        <option value="Kesehatan">Kesehatan</option>
        <option value="Kreatif">Kreatif</option>
      </select>
    </div>

    <div id="products-container" data-testid="products-container">
      <div class="empty-state"><div class="spinner" style="margin:0 auto;border-color:rgba(0,0,0,0.1);border-top-color:var(--primary)"></div></div>
    </div>
  </main>

  <!-- Modal Tambah ke Keranjang -->
  <div id="modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:200;align-items:center;justify-content:center">
    <div class="card" style="width:100%;max-width:400px;margin:1rem">
      <div class="card-header" id="modal-title">Detail Layanan</div>
      <div class="card-body" id="modal-body"></div>
      <div class="card-footer" style="display:flex;gap:0.5rem;justify-content:flex-end">
        <button class="btn btn-outline" onclick="closeModal()">Batal</button>
        <button class="btn btn-primary" id="modal-add-btn" data-testid="confirm-add-to-cart">Tambah ke Keranjang</button>
      </div>
    </div>
  </div>

  <script src="/js/services/api.js"></script>
  <script>
    // Wajib login untuk mengakses halaman ini
    if (!api.isLoggedIn()) {
      window.location.href = '/login.html';
    }

    let selectedProduct = null;
    let modalQty = 1;

    async function init() {
      const count = await updateCartCount().catch(() => 0);
      renderNavbar(count);
      loadProducts();

      document.getElementById('search-input').addEventListener('input', debounce(loadProducts, 400));
      document.getElementById('category-filter').addEventListener('change', loadProducts);
    }

    async function loadProducts() {
      const search = document.getElementById('search-input').value;
      const category = document.getElementById('category-filter').value;
      let params = [];
      if (search) params.push(`search=${encodeURIComponent(search)}`);
      if (category) params.push(`category=${encodeURIComponent(category)}`);
      const qs = params.length ? '?' + params.join('&') : '';

      try {
        const data = await api.getProducts(qs);
        renderProducts(data.data);
      } catch (err) {
        document.getElementById('products-container').innerHTML =
          `<div class="alert alert-danger">Gagal memuat data layanan: ${err.message}</div>`;
      }
    }

    function renderProducts(products) {
      const container = document.getElementById('products-container');
      if (!products.length) {
        container.innerHTML = `<div class="empty-state"><div class="icon">ðŸ”</div><h3>Layanan tidak ditemukan</h3><p>Coba kata kunci lain.</p></div>`;
        return;
      }
      container.innerHTML = `<div class="product-grid" data-testid="product-list">${products.map(renderProductCard).join('')}</div>`;
    }

    function renderProductCard(p) {
      const stockClass = p.stock === 0 ? 'out' : p.stock <= 3 ? 'low' : '';
      const stockText = p.stock === 0 ? 'Habis' : `Tersedia: ${p.stock}`;
      const imgContent = p.image_url
        ? `<img src="${p.image_url}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover" onerror="this.parentElement.innerHTML='${getCategoryEmoji(p.category)}';">`
        : getCategoryEmoji(p.category);
      return `
        <div class="card product-card" data-testid="product-card" data-product-id="${p.id}">
          <div class="product-img">${imgContent}</div>
          <div class="product-info">
            <div class="product-category">${p.category}</div>
            <div class="product-name">${p.name}</div>
            <div class="product-price">${formatRupiah(p.price)}</div>
            <div class="product-stock ${stockClass}">${stockText}</div>
            <button class="btn btn-primary btn-sm" style="width:100%"
              onclick="openModal(${p.id})"
              ${p.stock === 0 ? 'disabled' : ''}
              data-testid="add-to-cart-btn">
              ${p.stock === 0 ? 'Stok Habis' : '+ Tambah ke Keranjang'}
            </button>
          </div>
        </div>`;
    }

    async function openModal(productId) {
      try {
        const data = await api.getProduct(productId);
        selectedProduct = data.data;
        modalQty = 1;

        document.getElementById('modal-title').textContent = selectedProduct.name;
        document.getElementById('modal-body').innerHTML = `
          <p style="color:var(--text-muted);font-size:0.875rem;margin-bottom:1rem">${selectedProduct.description || ''}</p>
          <div style="display:flex;justify-content:space-between;margin-bottom:1rem">
            <span>Harga:</span><strong>${formatRupiah(selectedProduct.price)}</strong>
          </div>
          <div style="display:flex;justify-content:space-between;margin-bottom:1rem">
            <span>Stok:</span><strong>${selectedProduct.stock} unit</strong>
          </div>
          <div class="form-group">
            <label class="form-label">Jumlah</label>
            <div class="qty-control">
              <button class="qty-btn" onclick="changeQty(-1)">âˆ’</button>
              <input type="number" class="qty-input" id="modal-qty" value="1" min="1" max="${Math.min(10, selectedProduct.stock)}" data-testid="quantity-input">
              <button class="qty-btn" onclick="changeQty(1)">+</button>
            </div>
          </div>
          <div id="modal-error" class="alert alert-danger" style="display:none"></div>
        `;

        document.getElementById('modal-overlay').style.display = 'flex';
        document.getElementById('modal-add-btn').onclick = addToCart;
      } catch (err) {
        showToast('Gagal memuat detail layanan.', 'error');
      }
    }

    function changeQty(delta) {
      const input = document.getElementById('modal-qty');
      const newVal = parseInt(input.value) + delta;
      const max = Math.min(10, selectedProduct.stock);
      if (newVal >= 1 && newVal <= max) { input.value = newVal; modalQty = newVal; }
    }

    function closeModal() {
      document.getElementById('modal-overlay').style.display = 'none';
      selectedProduct = null;
    }

    async function addToCart() {
      const qty = parseInt(document.getElementById('modal-qty').value);
      const errEl = document.getElementById('modal-error');
      errEl.style.display = 'none';

      try {
        await api.addToCart(selectedProduct.id, qty);
        closeModal();
        showToast(`${selectedProduct.name} berhasil ditambahkan ke keranjang!`);
        updateCartCount();
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
      }
    }

    function debounce(fn, delay) {
      let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), delay); };
    }

    init();
  </script>
</body>
</html>
