<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Sistem Reservasi Layanan</title>
  <link rel="stylesheet" href="/css/style.v2.css">
</head>
<body>
  <header class="navbar" id="navbar"></header>

  <main class="container">
    <div class="page-title">
      <h1>Checkout</h1>
      <p>Lengkapi data pengiriman untuk menyelesaikan pesanan</p>
    </div>
    <div id="checkout-container">
      <div class="empty-state"><div class="spinner" style="margin:0 auto;border-color:rgba(0,0,0,0.1);border-top-color:var(--primary)"></div></div>
    </div>
  </main>

  <script src="/js/services/api.js"></script>
  <script>
    if (!requireLogin()) {}

    async function init() {
      renderNavbar();
      try {
        const data = await api.getCart();
        if (!data.data.items.length) {
          document.getElementById('checkout-container').innerHTML = `
            <div class="empty-state">
              <div class="icon">ðŸ›’</div>
              <h3>Keranjang kosong</h3>
              <p>Tambahkan layanan terlebih dahulu sebelum checkout.</p>
              <a href="/index.html" class="btn btn-primary" style="margin-top:1rem">Lihat Layanan</a>
            </div>`;
          return;
        }
        renderCheckout(data.data);
      } catch (err) {
        document.getElementById('checkout-container').innerHTML =
          `<div class="alert alert-danger">Gagal memuat keranjang: ${err.message}</div>`;
      }
    }

    function renderCheckout(cart) {
      const user = api.getUser();
      document.getElementById('checkout-container').innerHTML = `
        <div style="display:grid;grid-template-columns:1fr 360px;gap:1.5rem;align-items:start">
          <div>
            <div class="card">
              <div class="card-header">Data Penerima</div>
              <div class="card-body">
                <div id="form-error" class="alert alert-danger" style="display:none" data-testid="checkout-error"></div>
                <form id="checkout-form" novalidate>
                  <div class="form-group">
                    <label class="form-label">Nama Penerima *</label>
                    <input type="text" id="receiver_name" class="form-control" 
                           value="${user?.full_name || ''}" placeholder="Nama lengkap penerima"
                           data-testid="receiver-name-input">
                    <div class="invalid-feedback">Nama penerima wajib diisi.</div>
                  </div>
                  <div class="form-group">
                    <label class="form-label">Nomor Telepon *</label>
                    <input type="tel" id="phone" class="form-control"
                           value="${user?.phone || ''}" placeholder="Contoh: 08123456789"
                           data-testid="phone-input">
                    <div class="invalid-feedback">Nomor telepon wajib diisi.</div>
                  </div>
                  <div class="form-group">
                    <label class="form-label">Alamat / Lokasi Layanan *</label>
                    <textarea id="address" class="form-control" rows="3"
                              placeholder="Masukkan alamat lengkap tempat layanan akan dilakukan"
                              data-testid="address-input"></textarea>
                    <div class="invalid-feedback">Alamat wajib diisi.</div>
                  </div>
                  <div class="form-group">
                    <label class="form-label">Catatan (opsional)</label>
                    <textarea id="notes" class="form-control" rows="2"
                              placeholder="Catatan tambahan untuk penyedia layanan" data-testid="notes-input"></textarea>
                  </div>
                </form>
              </div>
            </div>
          </div>
          <div>
            <div class="card">
              <div class="card-header">Ringkasan Pesanan</div>
              <div class="card-body">
                <div id="order-items">${cart.items.map(item => `
                  <div class="summary-row">
                    <span>${item.name} Ã—${item.quantity}</span>
                    <span>${formatRupiah(item.subtotal)}</span>
                  </div>`).join('')}
                </div>
                <div class="summary-row total">
                  <span>Total</span><span data-testid="checkout-total">${formatRupiah(cart.total_price)}</span>
                </div>
              </div>
              <div class="card-footer" style="display:flex;flex-direction:column;gap:0.5rem">
                <button id="place-order-btn" class="btn btn-success" style="justify-content:center"
                        onclick="placeOrder()" data-testid="place-order-btn">
                  âœ“ Buat Pesanan
                </button>
                <a href="/cart.html" class="btn btn-outline" style="justify-content:center">â† Kembali ke Keranjang</a>
              </div>
            </div>
          </div>
        </div>`;
    }

    async function placeOrder() {
      const receiver_name = document.getElementById('receiver_name').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const address = document.getElementById('address').value.trim();
      const notes = document.getElementById('notes').value.trim();
      const errEl = document.getElementById('form-error');
      errEl.style.display = 'none';

      let valid = true;
      ['receiver_name', 'phone', 'address'].forEach(id => {
        const el = document.getElementById(id);
        if (!el.value.trim()) { el.classList.add('is-invalid'); valid = false; }
        else el.classList.remove('is-invalid');
      });

      if (!valid) {
        errEl.textContent = 'Semua field bertanda * wajib diisi.';
        errEl.style.display = 'block';
        return;
      }

      const btn = document.getElementById('place-order-btn');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div> Memproses...';

      try {
        const data = await api.createOrder({ receiver_name, phone, address, notes });
        showToast('Pesanan berhasil dibuat!', 'success');
        setTimeout(() => window.location.href = `/orders.html`, 800);
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = 'âœ“ Buat Pesanan';
      }
    }

    init();
  </script>
</body>
</html>
