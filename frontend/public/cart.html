<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keranjang - Sistem Reservasi Layanan</title>
  <link rel="stylesheet" href="/css/style.v2.css">
</head>
<body>
  <header class="navbar" id="navbar"></header>

  <main class="container">
    <div class="page-title">
      <h1>Keranjang Belanja</h1>
      <p>Kelola layanan yang ingin Anda pesan</p>
    </div>
    <div id="cart-container" data-testid="cart-container">
      <div class="empty-state"><div class="spinner" style="margin:0 auto;border-color:rgba(0,0,0,0.1);border-top-color:var(--primary)"></div></div>
    </div>
  </main>

  <script src="/js/services/api.js"></script>
  <script>
    if (!requireLogin()) {}

    async function init() {
      renderNavbar();
      loadCart();
    }

    async function loadCart() {
      try {
        const data = await api.getCart();
        renderCart(data.data);
        const el = document.getElementById('cart-count');
        if (el) el.textContent = data.data.total_items;
      } catch (err) {
        document.getElementById('cart-container').innerHTML =
          `<div class="alert alert-danger">Gagal memuat keranjang: ${err.message}</div>`;
      }
    }

    function renderCart(cart) {
      const container = document.getElementById('cart-container');
      if (!cart.items.length) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="icon">ðŸ›’</div>
            <h3>Keranjang Anda kosong</h3>
            <p>Tambahkan layanan dari halaman utama</p>
            <a href="/index.html" class="btn btn-primary" style="margin-top:1rem">Lihat Layanan</a>
          </div>`;
        return;
      }

      container.innerHTML = `
        <div style="display:grid;grid-template-columns:1fr 300px;gap:1.5rem;align-items:start">
          <div>
            <div class="card">
              <div class="card-header" style="display:flex;justify-content:space-between;align-items:center">
                <span>Item Keranjang (${cart.total_items})</span>
                <button class="btn btn-danger btn-sm" onclick="clearCart()" data-testid="clear-cart-btn">ðŸ—‘ Kosongkan</button>
              </div>
              <div id="cart-items" data-testid="cart-items"></div>
            </div>
          </div>
          <div>
            <div class="card">
              <div class="card-header">Ringkasan Pesanan</div>
              <div class="card-body">
                <div class="summary-row">
                  <span>Total Item</span><span>${cart.total_items} layanan</span>
                </div>
                <div class="summary-row total">
                  <span>Total Harga</span><span id="total-price" data-testid="total-price">${formatRupiah(cart.total_price)}</span>
                </div>
              </div>
              <div class="card-footer">
                <a href="/checkout.html" class="btn btn-primary" style="width:100%;justify-content:center" data-testid="checkout-btn">
                  Lanjut ke Checkout â†’
                </a>
              </div>
            </div>
          </div>
        </div>`;

      renderCartItems(cart.items);
    }

    function renderCartItems(items) {
      const container = document.getElementById('cart-items');
      container.innerHTML = items.map(item => `
        <div class="table" style="display:block">
          <div style="display:flex;align-items:center;padding:1rem;border-bottom:1px solid var(--border);gap:1rem" data-testid="cart-item" data-cart-id="${item.id}">
            <div style="font-size:2rem">${getCategoryEmoji(item.category)}</div>
            <div style="flex:1">
              <div style="font-weight:600">${item.name}</div>
              <div style="color:var(--primary);font-weight:500">${formatRupiah(item.price)} / unit</div>
              <div style="font-size:0.8rem;color:var(--text-muted)">Stok: ${item.stock}</div>
            </div>
            <div class="qty-control">
              <button class="qty-btn" onclick="updateQty(${item.id}, ${item.quantity - 1}, ${item.stock})" data-testid="qty-decrease">âˆ’</button>
              <span class="qty-input" style="display:inline-flex;align-items:center;justify-content:center" data-testid="qty-value">${item.quantity}</span>
              <button class="qty-btn" onclick="updateQty(${item.id}, ${item.quantity + 1}, ${item.stock})" data-testid="qty-increase">+</button>
            </div>
            <div style="width:100px;text-align:right">
              <div style="font-weight:600">${formatRupiah(item.subtotal)}</div>
            </div>
            <button class="btn btn-danger btn-sm" onclick="removeItem(${item.id})" data-testid="remove-item-btn">âœ•</button>
          </div>
        </div>`).join('');
    }

    async function updateQty(id, newQty, stock) {
      if (newQty < 1) { showToast('Jumlah minimal 1. Gunakan tombol hapus untuk menghapus.', 'warning'); return; }
      if (newQty > 10) { showToast('Jumlah maksimal 10 per layanan.', 'warning'); return; }
      if (newQty > stock) { showToast(`Stok tidak mencukupi (${stock} tersedia).`, 'warning'); return; }
      try {
        await api.updateCart(id, newQty);
        loadCart();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function removeItem(id) {
      try {
        await api.removeFromCart(id);
        showToast('Layanan berhasil dihapus dari keranjang.');
        loadCart();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function clearCart() {
      if (!confirm('Kosongkan semua item dari keranjang?')) return;
      try {
        await api.clearCart();
        showToast('Keranjang berhasil dikosongkan.');
        loadCart();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    init();
  </script>
</body>
</html>
